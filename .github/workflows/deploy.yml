name: Deploy to EC2

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tests
        run: pytest -q

      - name: Build Docker Image
        run: docker build -t devops-mini-app .

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: SSH and Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          script: |
            set -e
            cd /home/ubuntu/devops-mini-app-logs
            git pull origin master

            docker build -t devops-mini-app:latest .

            docker rm -f devops-app-candidate || true
            docker run -d -p 5001:5000 --name devops-app-candidate \
              -e ENABLE_S3_LOGGING=true \
              -e S3_BUCKET_NAME=devops-mini-app-logs \
              -e AWS_REGION=eu-north-1 \
              devops-mini-app:latest

            sleep 8
            curl --fail --silent http://localhost:5001/health > /dev/null

            HAS_OLD=0
            if docker ps -a --format '{{.Names}}' | grep -q '^devops-app$'; then
              HAS_OLD=1
              docker commit devops-app devops-mini-app:rollback || true
            fi

            docker stop devops-app || true
            docker rm devops-app || true

            docker run -d -p 5000:5000 --name devops-app \
              -e ENABLE_S3_LOGGING=true \
              -e S3_BUCKET_NAME=devops-mini-app-logs \
              -e AWS_REGION=eu-north-1 \
              devops-mini-app:latest

            sleep 5
            if ! curl --fail --silent http://localhost:5000/health > /dev/null; then
              docker logs devops-app || true
              docker rm -f devops-app || true

              if [ "$HAS_OLD" = "1" ]; then
                docker run -d -p 5000:5000 --name devops-app \
                  -e ENABLE_S3_LOGGING=true \
                  -e S3_BUCKET_NAME=devops-mini-app-logs \
                  -e AWS_REGION=eu-north-1 \
                  devops-mini-app:rollback
                sleep 5
                curl --fail --silent http://localhost:5000/health > /dev/null
              fi

              exit 1
            fi

            docker rm -f devops-app-candidate || true
