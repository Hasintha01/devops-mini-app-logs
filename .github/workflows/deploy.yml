name: Deploy to EC2

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Build Docker Image
        run: docker build -t devops-mini-app .

      - name: SSH and Deploy to EC2
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd /home/ubuntu/devops-mini-app-logs
            git pull origin master
            docker stop devops-app || true
            docker rm devops-app || true
            docker build -t devops-mini-app .
            docker run -d -p 5000:5000 --name devops-app \
              -e ENABLE_S3_LOGGING=true \
              -e S3_BUCKET_NAME=devops-mini-app-logs \
              -e AWS_REGION=eu-north-1 \
              devops-mini-app
